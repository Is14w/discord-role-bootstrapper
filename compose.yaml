services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      GUILD_ID: ${GUILD_ID:?Set GUILD_ID in .env before starting the bot.}
    command:
      - sh
      - -c
      - exec node src/serve-role-panels.js "$${GUILD_ID}"
    init: true
    restart: unless-stopped
